# Set terminal to 256 Color by default
set -g default-terminal "screen-256color"

# shorted command delay
set -sg escape-time 1

# Pass through extended key sequences (Shift+Enter, Ctrl+Enter, etc.)
set -g extended-keys always
set -as terminal-features 'xterm*:extkeys'

# Set prefix to Ctrl-a
set -g prefix C-a
unbind C-b

# History to 30k
set -g history-limit 30000

# Set split keys
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Set movement between panes
bind-key k select-pane -U
bind-key j select-pane -D
bind-key h select-pane -L
bind-key l select-pane -R

# Resize Panes
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# Reload ~/.tmux.conf using prefix r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# ----------------------
# Status bar
# ----------------------
set-option -g status on
set -g status-interval 5
set -g status-justify centre

# visual notification of activity in other windows
setw -g monitor-activity on
set -g visual-activity on

# set color for status bar
set-option -g status-style bg=default,fg=colour245

# set window list colors - muted for inactive, bold for active
set-window-option -g window-status-style fg=colour245
set-window-option -g window-status-current-style fg=colour223,bold

# left side: session name + git branch (with dirty indicator, capped at 20 chars)
set -g status-left-length 40
set -g status-left '#[fg=blue]#S #[fg=green]#(cd "#{pane_current_path}" 2>/dev/null || exit; b=$(git symbolic-ref --short HEAD 2>/dev/null); [ -z "$b" ] && exit; d=$(git status --porcelain 2>/dev/null | head -c1); printf "| %%.20s%%s" "$b" "${d:+*}") '

# right side: battery, date, local time, UTC time
set -g status-right-length 70
set -g status-right "#[fg=cyan]#(pmset -g batt | grep -Eo '[0-9]+%%' | head -n 1) #[fg=yellow]: %d %b %Y #[fg=green]: %l:%M %p : #(date -u | awk '{print $4}') :"

# ------------------
# Copy & Paste
# ------------------
# Access to clipboard
set-window-option -g automatic-rename on

# use vim keybindings in copy mode
setw -g mode-keys vi

# bind v as begin selection
bind-key -T copy-mode-vi v send-keys -X begin-selection
if-shell "uname | grep -q Darwin" \
    'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"' \
    'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"'
